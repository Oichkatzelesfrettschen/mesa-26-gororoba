
query($owner:String!, $repo:String!, $cursor:String) {
  repository(owner:$owner, name:$repo) {
    defaultBranchRef { name target { ... on Commit { oid } } }
    pullRequests(
      first:100
      after:$cursor
      states:[OPEN,CLOSED,MERGED]
      orderBy:{field:CREATED_AT,direction:ASC}
    ) {
      pageInfo { hasNextPage endCursor }
      nodes {
        number
        title
        url
        state
        createdAt
        mergedAt
        mergeCommit { oid }
        closedAt
        reviewThreads(first:100) {
          pageInfo { hasNextPage endCursor }
          nodes {
            id
            isResolved
            isOutdated
            path
            line
            originalLine
            comments(first:10) {
              totalCount
              pageInfo { hasNextPage endCursor }
              nodes {
                id
                databaseId
                author { login }
                body
                createdAt
                updatedAt
                url
                diffHunk
                commit { oid }
                originalCommit { oid }
              }
            }
          }
        }
      }
    }
  }
}

# Component allowlist for the Radeon-minimal build profiles.
# One row per config basename under build-infra/configs{,/alternates}/.
# profile_audit.py fails on any selected driver outside its row and on
# any config without a row.  The allowlist PERMITS; the configs CHOOSE:
# zink is allowed in every row (standing decision: the zink-upon-r3v and
# zink-on-terakan lanes must never trip the audit), while the r300
# release CONFIG still selects only r300.  The terakan rows also carry
# the software rasterizers their x130e reference runs compare against.

[profile."3_r300_full_debug_optimized_x86_64v1-clang22-distcc-cache"]
tag = "debug"
gallium-drivers = ["r300", "zink"]
vulkan-drivers = ["ati_r300"]

[profile."4_r300_full_release_x86_64v1-clang22-distcc-cache"]
tag = "release"
gallium-drivers = ["r300", "zink"]
vulkan-drivers = ["ati_r300"]


# Global GL pin for the r300 system package. Vulkan ICD selection is left to
# the loader so a retained lib32 RADV ICD can be discovered for 32-bit clients
# (Steam). Scoped probes use mesa-gororoba-run / mesa-gororoba-env.sh, which
# set VK_DRIVER_FILES to the r3v ICD explicitly.
__EGL_VENDOR_LIBRARY_FILENAMES=/usr/share/glvnd/egl_vendor.d/50_mesa.json
MESA_LOADER_DRIVER_OVERRIDE=r300
LIBGL_ALWAYS_SOFTWARE=0
LIBVA_DRIVER_NAME=r300
DRAW_USE_LLVM=0

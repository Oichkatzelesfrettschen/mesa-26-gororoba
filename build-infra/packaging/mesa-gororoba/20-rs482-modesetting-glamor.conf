# RS482/RS485 Xorg policy for Mesa 26 r300 GLX clients.
#
# Mesa 26 GLX uses DRI3 for the hardware client path.  xf86-video-ati's radeon
# DDX exposes DRI2 on RS482, which lets the X server initialize AIGLX with r300
# but leaves GLX clients on swrast/llvmpipe.  Use modesetting with glamor for
# day-to-day GLX validation on RS482-class hosts.
Section "Device"
    Identifier "Radeon RS482 modesetting glamor"
    Driver "modesetting"
    Option "AccelMethod" "glamor"
EndSection

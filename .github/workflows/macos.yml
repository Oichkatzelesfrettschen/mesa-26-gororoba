name: macOS-CI
on: push

permissions:
  contents: read

jobs:
  macOS-CI:
    if: vars.MACOS_CI_AVAILABLE == 'true'
    strategy:
      matrix:
        glx_option: ['dri', 'xlib']
    runs-on: macos-15
    env:
      GALLIUM_DUMP_CPU: true
    steps:
    - name: Checkout
      uses: actions/checkout@v6
    - name: Install Dependencies
      run: |
        cat > Brewfile <<EOL
        brew "bison"
        brew "expat"
        brew "gettext"
        brew "libx11"
        brew "libxcb"
        brew "libxdamage"
        brew "libxext"
        brew "libxrandr"
        brew "llvm"
        brew "molten-vk"
        brew "ninja"
        brew "pkg-config"
        brew "python@3.14"
        EOL

        brew update
        brew bundle --verbose
    - name: Install Mako and meson
      run: |
        python3.14 -m venv "$RUNNER_TEMP/mesa-python"
        "$RUNNER_TEMP/mesa-python/bin/pip" install \
          "mako==1.3.10" "meson==1.11.1" "packaging==25.0" \
          "PyYAML==6.0.3"
        echo "$RUNNER_TEMP/mesa-python/bin" >> "$GITHUB_PATH"
    - name: Configure
      run: |
        cat > native_config <<EOL
        [binaries]
        llvm-config = '$(brew --prefix llvm)/bin/llvm-config'
        EOL
        moltenvk_dir=$(brew --prefix molten-vk)
        meson setup build --native-file=native_config \
          "-Dmoltenvk-dir=$moltenvk_dir" -Dbuild-tests=true \
          -Dgallium-drivers=llvmpipe,softpipe,zink \
          -Dglx=${{ matrix.glx_option }}
    - name: Build
      run: meson compile -C build
    - name: Test
      run: meson test -C build --print-errorlogs
    - name: Install
      run: meson install -C build --destdir "$PWD/install"
    - name: 'Upload Artifact'
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: macos-${{ matrix.glx_option }}-result
        path: |
          build/meson-logs/
          install/
        retention-days: 5
